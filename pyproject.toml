[project]
name = "deep-learning2-exam"
version = "0.1.0"
description = "examen deep learning"
authors = [
    {name = "Adama sarr"}
]
license = {text = "DIT"}
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "torch (==2.7.1)",
    "torchvision (==0.22.1)",
    "torchaudio (==2.7.1)",
    "transformers (>=5.14.1,<6.0.0)",
    "datasets (>=5.0.0,<6.0.0)",
    "gradio (>=6.20.0,<7.0.0)",
    "fastapi (>=0.139.2,<0.140.0)",
    "numpy (>=1.24.0,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "torchcodec (>=0.15.0,<0.16.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "soundfile (>=0.14.0,<0.15.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pyctcdecode (>=0.5.0,<0.6.0)",
    "sentencepiece (>=0.2.2,<0.3.0)",
    "tiktoken (>=0.13.0,<0.14.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
